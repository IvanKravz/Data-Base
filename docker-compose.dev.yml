services:
  db:
    image: postgres:15.2
    container_name: db_dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data/
    ports:
      - "5432:5432"
    networks:
      - dev_network
    # Проверка готовности Postgres: healthcheck выполняется каждые 5 сек,
    # пока pg_isready не вернёт успех. Compose будет ждать этого статуса
    # перед запуском backend (см. depends_on ниже).
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build: ./backend
    container_name: backend_dev
    restart: unless-stopped
    environment:
      - DJANGO_ENV=development
      - DB_ENGINE=django.db.backends.postgresql
      - DEBUG=True
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=db
      - DB_PORT=5432
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - CORS_ALLOWED_ORIGINS=http://localhost:5173
      - DJANGO_SUPERUSER_USERNAME=${DJANGO_SUPERUSER_USERNAME}
      - DJANGO_SUPERUSER_PASSWORD=${DJANGO_SUPERUSER_PASSWORD}
      - DJANGO_SUPERUSER_EMAIL=${DJANGO_SUPERUSER_EMAIL}
      - INITIAL_DATA=${INITIAL_DATA:-false}
    volumes:
      # В dev монтируем весь код — работает авторелоад.
      - ./backend:/app
      # Медиа выносим в volume, чтобы файлы пережили пересборку образа.
      - media_volume_dev:/app/media
      # Статику в dev не собираем (collectstatic отключён в entrypoint),
      # поэтому volume не нужен.
    ports:
      - "8000:8000"
    # Ждём не просто «контейнер запущен», а «БД готова принимать соединения».
    depends_on:
      db:
        condition: service_healthy
    networks:
      - dev_network

volumes:
  postgres_data_dev:
  media_volume_dev:

networks:
  dev_network:
    driver: bridge
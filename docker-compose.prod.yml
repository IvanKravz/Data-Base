services:
  db:
    image: postgres:15.2
    container_name: db_prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  backend:
    build: ./backend
    image: myapp_backend:latest
    container_name: backend_prod
    restart: unless-stopped
    environment:
      - DJANGO_ENV=production
      - DB_ENGINE=django.db.backends.postgresql
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=db
      - DB_PORT=5432
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
      - DJANGO_SUPERUSER_USERNAME=${DJANGO_SUPERUSER_USERNAME}
      - DJANGO_SUPERUSER_PASSWORD=${DJANGO_SUPERUSER_PASSWORD}
      - DJANGO_SUPERUSER_EMAIL=${DJANGO_SUPERUSER_EMAIL}
      - INITIAL_DATA=${INITIAL_DATA:-false}
    volumes:
      - media_volume:/app/media
      - static_volume:/app/static
      - ./backend/data:/app/data
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: myapp_frontend:latest
    container_name: frontend_prod
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      # nginx отдаёт статику и медиа из общих volume'ов.
      - media_volume:/app/media
      - static_volume:/app/static
      # Внешние data-каталоги для карт (плитки, растры).
      - /data/mapdata/tiles:/usr/share/nginx/html/tiles
      - /data/mapdata/map:/usr/share/nginx/html/map
    depends_on:
      - backend
    networks:
      - app_network

volumes:
  postgres_data:
  media_volume:
  static_volume:

networks:
  app_network:
    driver: bridge